name: Verify and replace DSS 0.5.0 RC2
on:
  push:
    branches: ['publish/0.5.0-rc.2-replacement-485d5062']
permissions:
  contents: read
concurrency:
  group: dss-rc2-replacement
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Match package tooling
        run: npm install -g npm@11.9.0 --ignore-scripts
      - name: Pack the fixed production files and verify all bytes
        run: |
          set -euo pipefail
          umask 022
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); for (const f of ["package.json", ...p.files]) { if (f.startsWith("/") || f.split("/").includes("..")) throw Error("unsafe package path"); fs.chmodSync(f, 0o644); }'
          mkdir dist
          npm pack --offline --ignore-scripts --pack-destination dist
          mv dist/deepseek-servant-0.5.0.tgz dist/deepseek-servant-0.5.0-rc.2.tgz
          python3 scripts/release-v0.5.0-rc.2/verify-package.py dist/deepseek-servant-0.5.0-rc.2.tgz
          cp scripts/release-v0.5.0-rc.2/RC2-MANIFEST-485d5062c5ea.json dist/
      - uses: actions/upload-artifact@v4
        with:
          name: verified-rc2-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  replace:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: verified-rc2-${{ github.sha }}
          path: dist
      - name: Preserve old assets and replace RC2 with the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -u scripts/release-v0.5.0-rc.2/replace.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rc2-replacement-verification-${{ github.sha }}
          path: replacement-evidence/
          if-no-files-found: warn
          retention-days: 30
