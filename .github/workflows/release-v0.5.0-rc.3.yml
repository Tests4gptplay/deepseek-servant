name: Verify DSS 0.5.0 RC3 prerelease
on:
  push:
    branches: ['release/0.5.0-rc.3']
    tags: ['v0.5.0-rc.3']
permissions:
  contents: read
concurrency:
  group: dss-rc3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match package tooling
        run: npm install -g npm@11.9.0 --ignore-scripts
      - name: Repack and verify the previously built fixed candidate
        run: |
          set -euo pipefail
          umask 022
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); for (const f of ["package.json", ...p.files]) { if (f.startsWith("/") || f.split("/").includes("..")) throw Error("unsafe package path"); fs.chmodSync(f, 0o644); }'
          mkdir dist
          npm pack --offline --ignore-scripts --pack-destination dist
          python3 scripts/release-v0.5.0-rc.3/verify-package.py dist/deepseek-servant-0.5.0-rc.3.tgz
          cp scripts/release-v0.5.0-rc.3/manifest.json dist/RC3-MANIFEST.json
          (cd dist && sha256sum deepseek-servant-0.5.0-rc.3.tgz > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dss-v0.5.0-rc.3-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref == 'refs/tags/v0.5.0-rc.3'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dss-v0.5.0-rc.3-${{ github.sha }}
          path: dist
      - name: Verify tag and package before publication
        run: |
          set -euo pipefail
          test "$(git rev-parse 'v0.5.0-rc.3^{commit}')" = "$GITHUB_SHA"
          python3 scripts/release-v0.5.0-rc.3/verify-package.py dist/deepseek-servant-0.5.0-rc.3.tgz
          cmp scripts/release-v0.5.0-rc.3/manifest.json dist/RC3-MANIFEST.json
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish the new RC3 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/deepseek-servant
        run: |
          set -euo pipefail
          TAG='v0.5.0-rc.3'
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-query.err"; then
            echo 'Release already exists; refusing to overwrite assets.'
            exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/release-query.err" || { cat "$RUNNER_TEMP/release-query.err"; exit 1; }
          gh release create "$TAG" --verify-tag --prerelease --latest=false \
            --title 'DeepSeek Servant 0.5.0 RC3' \
            --notes-file scripts/release-v0.5.0-rc.3/NOTES.md \
            dist/deepseek-servant-0.5.0-rc.3.tgz dist/SHA256SUMS.txt dist/RC3-MANIFEST.json
  correct_notes_once:
    if: github.ref == 'refs/heads/release/0.5.0-rc.3' && github.event.head_commit.message == 'Correct RC3 Chinese release notes'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Correct only the approved Chinese release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/deepseek-servant
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v0.5.0-rc.3" > "$RUNNER_TEMP/release.json"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"])
          release = json.loads((p / "release.json").read_text())
          body = release["body"]
          assert release["id"] == 445189990 and release["tag_name"] == "v0.5.0-rc.3"
          assert hashlib.sha256(body.encode()).hexdigest() == "2d8db8d4760332595dbdcd0338f1e54b468620a6756817be82fe6ddd96ab070c", "Release body changed; refusing overwrite"
          sep = "---\n\n# DeepSeek Servant 0.5.0-rc.3 Prerelease"
          assert body.count(sep) == 1
          english = body[body.index(sep):]
          prefix = "# DeepSeek Servant 0.5.0-rc.3 预发布测试版\n\n本次更新围绕运行效率、任务协作与持续工作能力进行集中整理，大规模清理了 GPT 的防御性阻塞代码，并重构了内部部分被扭曲的非法设计。\n\n## 这次更新了什么\n\n- **运行效率**：合并重复读取，减少轮询与页面刷新中的重复工作，优化后台运行开销。\n- **任务协作**：梳理任务分派、并行推进与工作接续，减少任务之间以及前后台不必要的等待与相互阻塞。\n- **异常恢复**：改进异常处理与中断接续，围绕原任务、已有进展和成果继续推进。\n- **对话与历史**：优化消息发送与重试、历史加载、日期选择和翻阅体验，减少重复处理及旧请求对当前页面的干扰。\n- **记录整理**：完善成果归档、任务收尾和运行资料清理，减少重复处理与不必要的等待。\n\n## 升级提示\n\n由于本次系统构建更新较大，建议安装前先备份数据，并彻底清理历史文件后再安装。\n\n"
          (p / "patch.json").write_text(json.dumps({"body": prefix + english}, ensure_ascii=False))
          PY
          gh api --method PATCH "repos/$GH_REPO/releases/445189990" --input "$RUNNER_TEMP/patch.json" > /dev/null
