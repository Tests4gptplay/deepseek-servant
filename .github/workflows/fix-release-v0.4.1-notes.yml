name: Correct 0.4.1 release documentation links
on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/fix-release-v0.4.1-notes.yml'
      - 'scripts/release-display-v0.4.1/NOTES.md'
permissions:
  contents: read
concurrency:
  group: deepseek-servant-release-notes-v0.4.1
  cancel-in-progress: false
jobs:
  correct-notes:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Correct only the published release body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/deepseek-servant
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/v0.4.1" > "$RUNNER_TEMP/release-before.json"
          jq -e '.tag_name == "v0.4.1" and .draft == false and .prerelease == false' "$RUNNER_TEMP/release-before.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-before.json" > "$RUNNER_TEMP/assets-before.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.4.1" > "$RUNNER_TEMP/tag-before.json"
          test "$(jq -r .object.sha "$RUNNER_TEMP/tag-before.json")" = 'fffe4c416945b7767d3e1b143346c43e6792b15c'
          gh release edit v0.4.1 --notes-file scripts/release-display-v0.4.1/NOTES.md
          gh api "repos/$GH_REPO/releases/tags/v0.4.1" > "$RUNNER_TEMP/release-after.json"
          jq '[.assets[] | {id, name, size, digest}]' "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/assets-after.json"
          cmp "$RUNNER_TEMP/assets-before.json" "$RUNNER_TEMP/assets-after.json"
          gh api "repos/$GH_REPO/git/ref/tags/v0.4.1" > "$RUNNER_TEMP/tag-after.json"
          cmp "$RUNNER_TEMP/tag-before.json" "$RUNNER_TEMP/tag-after.json"
          jq -r .body "$RUNNER_TEMP/release-after.json" > "$RUNNER_TEMP/body-after.md"
          diff -u <(sed -e '${/^$/d;}' scripts/release-display-v0.4.1/NOTES.md) <(sed -e '${/^$/d;}' "$RUNNER_TEMP/body-after.md")
