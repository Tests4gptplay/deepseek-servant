name: One-time DeepSeek Servant v0.2.3 release copyedit

on:
  push:
    paths:
      - '.github/workflows/release-copyedit-v023.yml'

permissions:
  contents: write

jobs:
  release-copyedit:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-latest
    steps:
      - name: Edit release description in place
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: 'v0.2.3' });
            const previous = '- 两种前台均提供按需读取的 Foreground_List / Foreground_Cache；完成事项及时从 List 清理，Cache 可自由重写、删减、清空，无字数上限。';
            const revised = '- 两种前台均提供按需读取的 Foreground_List / Foreground_Cache，两者均无字数上限。List 维护重要交代及原始记录索引，完成事项及时清理；Cache 可自由重写、删减和清空。';
            const unrelated = '- 安装不设置 DSH 版本号门槛，升级保留已有配置与数据。\n';
            if (!release.body?.includes(previous) || !release.body.includes(unrelated)) {
              throw new Error('Release body has changed; do not overwrite newer edits.');
            }
            const body = release.body.replace(previous, revised).replace(unrelated, '');
            await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body });
            const { data: check } = await github.rest.repos.getRelease({ owner, repo, release_id: release.id });
            if (check.body !== body) throw new Error('Release description did not persist exactly.');
            core.info('Release description updated and read back; no assets or tags changed.');
