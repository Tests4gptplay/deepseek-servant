name: Publish DSS 0.5.0
on:
  push:
    branches: ['main']
    paths: ['.github/workflows/release-v0.5.0.yml', 'scripts/release-v0.5.0/**']
permissions:
  contents: read
concurrency:
  group: dss-release-0.5.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match package tooling
        run: npm install -g npm@11.9.0 --ignore-scripts
      - name: Package and validate tested runtime
        run: |
          set -euo pipefail
          umask 022
          mkdir dist
          npm pack --offline --ignore-scripts --pack-destination dist
          python3 scripts/release-v0.5.0/verify-package.py dist/deepseek-servant-0.5.0.tgz
          git archive --format=zip --prefix=deepseek-servant-source/ HEAD -o dist/deepseek-servant-0.5.0-source.zip
          (cd dist && sha256sum deepseek-servant-0.5.0.tgz deepseek-servant-0.5.0-source.zip MANIFEST.json > SHA256SUMS.txt)
      - name: Publish formal release without overwriting existing versions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/deepseek-servant
        run: |
          set -euo pipefail
          TAG='v0.5.0'
          for ENDPOINT in "releases/tags/$TAG" "git/ref/tags/$TAG"; do
            if gh api "repos/$GH_REPO/$ENDPOINT" > "$RUNNER_TEMP/existing.json" 2> "$RUNNER_TEMP/query.err"; then
              echo "Release or tag already exists; refusing to overwrite."; exit 1
            fi
            grep -q 'HTTP 404' "$RUNNER_TEMP/query.err" || { cat "$RUNNER_TEMP/query.err"; exit 1; }
          done
          (cd dist && sha256sum -c SHA256SUMS.txt)
          gh release create "$TAG" --target "$GITHUB_SHA" --latest \
            --title 'DeepSeek Servant 0.5.0' \
            --notes-file scripts/release-v0.5.0/NOTES.md \
            dist/deepseek-servant-0.5.0.tgz dist/deepseek-servant-0.5.0-source.zip dist/SHA256SUMS.txt dist/MANIFEST.json
