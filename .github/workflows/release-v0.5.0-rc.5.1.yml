name: Verify DSS 0.5.0 RC5.1 prerelease
on:
  push:
    branches: ['release/0.5.0-rc.5.1']
permissions:
  contents: read
concurrency:
  group: dss-rc5-1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    if: github.repository == 'Tests4gptplay/deepseek-servant'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match package tooling
        run: npm install -g npm@11.9.0 --ignore-scripts
      - name: Repack and verify the previously built fixed candidate
        run: |
          set -euo pipefail
          umask 022
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); for (const f of ["package.json", ...p.files]) { if (f.startsWith("/") || f.split("/").includes("..")) throw Error("unsafe package path"); const mode = fs.statSync(f); if (mode.isDirectory()) { for (const n of fs.readdirSync(f, {recursive:true})) { const child = `${f}/${n}`; fs.chmodSync(child, fs.statSync(child).isDirectory() ? 0o755 : 0o644); } fs.chmodSync(f, 0o755); } else fs.chmodSync(f, 0o644); }'
          mkdir dist
          npm pack --offline --ignore-scripts --pack-destination dist
          python3 scripts/release-v0.5.0-rc.5.1/verify-package.py dist/deepseek-servant-0.5.0-rc.5.1.tgz
          cp scripts/release-v0.5.0-rc.5.1/manifest.json dist/RC5.1-MANIFEST.json
          git archive --format=zip --prefix=deepseek-servant-source/ HEAD -o dist/deepseek-servant-0.5.0-rc.5.1-source.zip
          (cd dist && sha256sum deepseek-servant-0.5.0-rc.5.1.tgz deepseek-servant-0.5.0-rc.5.1-source.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dss-v0.5.0-rc.5.1-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
  publish:
    if: github.ref == 'refs/heads/release/0.5.0-rc.5.1'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: dss-v0.5.0-rc.5.1-${{ github.sha }}
          path: dist
      - name: Verify tag and package before publication
        run: |
          set -euo pipefail
          python3 scripts/release-v0.5.0-rc.5.1/verify-package.py dist/deepseek-servant-0.5.0-rc.5.1.tgz
          cmp scripts/release-v0.5.0-rc.5.1/manifest.json dist/RC5.1-MANIFEST.json
          (cd dist && sha256sum -c SHA256SUMS.txt)
      - name: Publish new RC5.1 without changing RC5
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: Tests4gptplay/deepseek-servant
        run: |
          set -euo pipefail
          TAG='v0.5.0-rc.5.1'
          if gh api "repos/$GH_REPO/releases/tags/$TAG" > "$RUNNER_TEMP/existing-release.json" 2> "$RUNNER_TEMP/release-query.err"; then
            echo 'Release already exists; refusing to overwrite assets.'; exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/release-query.err" || { cat "$RUNNER_TEMP/release-query.err"; exit 1; }
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > "$RUNNER_TEMP/existing-tag.json" 2> "$RUNNER_TEMP/tag-query.err"; then
            echo 'Tag already exists; refusing to move it.'; exit 1
          fi
          grep -q 'HTTP 404' "$RUNNER_TEMP/tag-query.err" || { cat "$RUNNER_TEMP/tag-query.err"; exit 1; }
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'DeepSeek Servant 0.5.0 RC5.1' \
            --notes-file scripts/release-v0.5.0-rc.5.1/NOTES.md \
            dist/deepseek-servant-0.5.0-rc.5.1.tgz dist/deepseek-servant-0.5.0-rc.5.1-source.zip dist/SHA256SUMS.txt dist/RC5.1-MANIFEST.json
