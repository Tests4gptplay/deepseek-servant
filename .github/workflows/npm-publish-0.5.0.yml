name: Publish deepseek-servant 0.5.0 to npm
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: npm-deepseek-servant-0.5.0
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Tests4gptplay/deepseek-servant' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          registry-url: 'https://registry.npmjs.org'
      - name: Prepare complete verified release package
        shell: bash
        run: |
          set -euo pipefail
          mkdir original staging packed
          curl --fail --location --retry 2 --silent --show-error \
            https://github.com/Tests4gptplay/deepseek-servant/releases/download/v0.5.0/deepseek-servant-0.5.0.tgz \
            -o original/release.tgz
          echo 'd15f7c36eac35d5fd79da66f65bf5411988c4af0f312b056cd8db9bc138b3103  original/release.tgz' | sha256sum -c -
          python3 - <<'PY'
          import json, tarfile
          from pathlib import Path
          with tarfile.open("original/release.tgz") as t:
              assert all(m.isfile() and m.name.startswith("package/") and ".." not in Path(m.name).parts for m in t.getmembers())
              t.extractall("staging", filter="data")
          p = Path("staging/package/package.json")
          v = json.loads(p.read_text())
          assert v["name"] == "deepseek-servant" and v["version"] == "0.5.0" and v["private"] is True
          del v["private"]
          p.write_text(json.dumps(v, ensure_ascii=False, indent=2) + "\n")
          PY
          (cd staging/package && npm pack --offline --ignore-scripts --pack-destination ../../packed)
          python3 - <<'PY'
          import hashlib, json, tarfile
          def payload(path):
              with tarfile.open(path) as t:
                  return {m.name: t.extractfile(m).read() for m in t.getmembers()}
          a, b = payload("original/release.tgz"), payload("packed/deepseek-servant-0.5.0.tgz")
          assert a.keys() == b.keys(), "Package file set changed"
          for n in a:
              if n != "package/package.json": assert a[n] == b[n], n
          x, y = json.loads(a["package/package.json"]), json.loads(b["package/package.json"])
          del x["private"]
          assert x == y, "Unexpected metadata change"
          assert b["package/lib/host.js"] and b["package/lib/client.js"]
          print("Verified complete package:", len(b), "files; only private metadata removed.")
          PY
      - name: Publish authorized package
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSS_NPM }}
        run: |
          set -euo pipefail
          test -n "$NODE_AUTH_TOKEN" || { echo "DSS_NPM has not been configured."; exit 1; }
          npm publish ./packed/deepseek-servant-0.5.0.tgz --access public --ignore-scripts --registry https://registry.npmjs.org
      - name: Verify published package
        shell: bash
        run: |
          set -euo pipefail
          npm view deepseek-servant@0.5.0 name version dist.integrity --registry https://registry.npmjs.org
